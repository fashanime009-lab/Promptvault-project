<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site_name }} — Free AI Prompt Packs</title>
<meta name="description" content="{{ tagline }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; margin: 0; background: #fafafa; color: #1a1a2e; }
  .hero { background: linear-gradient(135deg, #1a1a2e, #4b3f9e); color: #fff; padding: 64px 24px; text-align: center; }
  .hero h1 { font-size: 34px; margin: 0 0 12px; font-weight: 800; }
  .hero p { opacity: 0.9; max-width: 520px; margin: 0 auto; }
  .grid { max-width: 960px; margin: -30px auto 0; padding: 0 24px 60px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .pack-card { background: #fff; border-radius: 14px; padding: 22px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); text-decoration: none; color: inherit; display: block; transition: transform 0.15s; }
  .pack-card:hover { transform: translateY(-3px); }
  .pack-card .cat { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #7c6fe0; font-weight: 700; }
  .pack-card h2 { font-size: 17px; margin: 8px 0; line-height: 1.35; }
  .pack-card p { font-size: 13px; color: #666; line-height: 1.5; margin: 0; }
  footer { text-align: center; padding: 30px; color: #999; font-size: 12px; }
</style>
</head>
<body>
  <div class="hero">
    <h1>{{ site_name }}</h1>
    <p>{{ tagline }}</p>
  </div>
  <div class="grid">
    {% for pack in packs %}
    <a class="pack-card" href="/packs/{{ pack.slug }}/">
      <div class="cat">{{ pack.category }}</div>
      <h2>{{ pack.title }}</h2>
      <p>{{ pack.description[:110] }}{% if pack.description|length > 110 %}...{% endif %}</p>
    </a>
    {% endfor %}
  </div>
  <footer>&copy; {{ year }} {{ site_name }}</footer>
</body>
</html>
