<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guides | {{ site_name }}</title>
<meta name="description" content="Practical guides on writing better AI prompts for ChatGPT, Midjourney, and more — from {{ site_name }}.">
<link rel="canonical" href="{{ site_url }}/blog/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Guides | {{ site_name }}">
<meta property="og:description" content="Practical guides on writing better AI prompts for ChatGPT, Midjourney, and more.">
<meta property="og:url" content="{{ site_url }}/blog/">
<meta property="og:image" content="{{ site_url }}/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161d27; --ink-soft: #414a59; --muted: #7c7566;
    --paper: #f0eee7; --card: #fbfaf6; --rule: #d9d3c2;
    --gold: #b8892b; --gold-deep: #7a5c17;
    --serif: 'Fraunces', serif; --sans: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--sans); margin: 0; background: var(--paper); color: var(--ink-soft); }
  a { color: inherit; }
  h1 { font-family: var(--serif); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .band-ink { background: var(--ink); color: var(--paper); }
  .topnav { max-width: 720px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; }
  .topnav .logo { font-family: var(--serif); font-weight: 600; font-size: 19px; text-decoration: none; color: #fff; }
  .crumb { font-size: 13px; color: #a39d8c; }
  .crumb a { text-decoration: none; color: #a39d8c; }
  .crumb a:hover { color: var(--gold); }

  .hero { max-width: 720px; margin: 0 auto; padding: 10px 24px 40px; }
  .hero h1 { font-size: clamp(28px, 4.4vw, 40px); margin: 0 0 12px; font-weight: 600; color: #fff; }
  .hero p { color: #d7d2c3; font-size: 15px; margin: 0; max-width: 50ch; }

  .list { max-width: 720px; margin: 0 auto; padding: 40px 24px 60px; }
  .post-card { display: block; text-decoration: none; color: inherit; border-top: 1px solid var(--rule); padding: 26px 0; }
  .post-card:last-child { border-bottom: 1px solid var(--rule); }
  .post-card .p-date { font-family: var(--mono); font-size: 11.5px; color: var(--gold-deep); margin: 0 0 8px; }
  .post-card h2 { font-family: var(--serif); font-size: 21px; margin: 0 0 8px; font-weight: 600; color: var(--ink); }
  .post-card:hover h2 { color: var(--gold-deep); text-decoration: underline; }
  .post-card p.desc { font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin: 0; }

  footer { padding: 30px 24px 40px; }
  footer .foot-inner { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: #a39d8c; }
  footer a { text-decoration: none; margin-left: 16px; }
  footer a:hover { color: var(--gold); }

  @media (max-width: 640px) {
    .topnav { padding: 18px 20px; }
    .hero { padding: 4px 20px 30px; }
    .list { padding: 30px 20px 40px; }
    footer .foot-inner { flex-direction: column; align-items: flex-start; }
    footer a:first-child { margin-left: 0; }
  }
</style>
</head>
<body>
  <div class="band-ink">
    <div class="topnav">
      <a class="logo" href="/">{{ site_name }}</a>
      <div class="crumb"><a href="/">Home</a> / Guides</div>
    </div>
    <div class="hero">
      <h1>Guides</h1>
      <p>Practical, no-fluff guides on getting better results from ChatGPT, Midjourney, and other AI tools.</p>
    </div>
  </div>

  <div class="list">
    {% for post in posts %}
    <a class="post-card" href="/blog/{{ post.slug }}/">
      <p class="p-date">{{ post.date }}</p>
      <h2>{{ post.title }}</h2>
      <p class="desc">{{ post.description }}</p>
    </a>
    {% endfor %}
  </div>

  <footer class="band-ink">
    <div class="foot-inner">
      <span>&copy; {{ year }} {{ site_name }}</span>
      <span>
        <a href="/">All packs</a>
      </span>
    </div>
  </footer>
</body>
</html>
